# Cutting a release
# =================
# Everything below is set off by one command:
#
#     git tag v3.1.0 && git push --tags
#
# The version in App_Core/package.json is the one that counts — the tag
# is only what starts the run. They are checked against each other
# before anything is built, because a mismatch would produce a file
# named after one version containing another, and that is the kind of
# mistake nobody notices until somebody reports a bug against the wrong
# build.

name: Release

on:
  push:
    tags:
      - 'v*'
  # A dry run: builds and uploads nothing, so the workflow can be tried
  # out without publishing anything.
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release and attach files
  # Build provenance. Every released file gets a signed statement saying
  # which commit, which workflow, and which runner produced it, so anyone
  # can check that the download really came from the source in this
  # repository and not from somebody's laptop:
  #
  #     gh attestation verify Parallax-Launcher.AppImage --owner ArdaYalinOzkan
  #
  # Readable source proves what the code says. This proves the file you
  # downloaded is that code.
  id-token: write        # to sign the attestation
  attestations: write    # to store it against the release

jobs:
  linux:
    name: Build for Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App_Core/package-lock.json

      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: App_Core
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG"
          echo "tag:          $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($PKG). Update the version, commit, then tag."
            exit 1
          fi

      - name: Install dependencies
        working-directory: App_Core
        run: npm ci

      # npm's postinstall does not reliably fetch Electron's own binary
      # — on this runner it does not fetch it at all, and a build
      # without it fails much later with a far less obvious message.
      #
      # --no-sandbox is required to run it here: Chromium's SUID sandbox
      # helper has to be owned by root and mode 4755, which it is not on
      # a CI runner, and Electron aborts rather than run unsandboxed. It
      # says nothing about how the built app runs on a real machine.
      - name: Make sure Electron's binary is present
        working-directory: App_Core
        run: |
          if [ ! -x node_modules/electron/dist/electron ]; then
            echo "Electron binary missing — fetching it"
            node node_modules/electron/install.js
          fi
          node_modules/electron/dist/electron --no-sandbox --version

      - name: Build
        working-directory: App_Core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npx electron-builder --linux AppImage deb --publish always
          else
            npx electron-builder --linux AppImage deb --publish never
          fi

      - name: List what was produced
        working-directory: App_Core
        run: ls -lh dist/ | grep -vE '^total|linux-unpacked|builder-'

      # Only for a real release. A dry run's files are never published,
      # so there is nothing for anybody to verify.
      - name: Attest what was built
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            App_Core/dist/*.AppImage
            App_Core/dist/*.deb

      # Kept for the dry run, where nothing is published — so there is
      # still something to download and try.
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: parallax-linux
          path: |
            App_Core/dist/*.AppImage
            App_Core/dist/*.deb
            App_Core/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build for Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App_Core/package-lock.json

      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: App_Core
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($PKG)."
            exit 1
          fi

      - name: Install dependencies
        working-directory: App_Core
        run: npm ci

      # The same gap as on Linux: npm does not reliably fetch Electron's
      # own binary, and without it the build fails much later with a far
      # less obvious message.
      - name: Make sure Electron's binary is present
        working-directory: App_Core
        shell: bash
        run: |
          if [ ! -f node_modules/electron/dist/electron.exe ]; then
            echo "Electron binary missing - fetching it"
            node node_modules/electron/install.js
          fi
          node -p "require('electron/package.json').version"

      # Unsigned. A code-signing certificate is a yearly cost, and
      # without one Windows shows SmartScreen's "unrecognised app"
      # warning on first run. That is said plainly on the download page
      # rather than left for people to be surprised by.
      - name: Build
        working-directory: App_Core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npx electron-builder --win --publish always
          else
            npx electron-builder --win --publish never
          fi

      - name: List what was produced
        working-directory: App_Core
        shell: bash
        run: ls -lh dist/ | grep -viE 'total|win-unpacked|builder-'

      - name: Attest what was built
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: App_Core/dist/*.exe

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: parallax-windows
          path: |
            App_Core/dist/*.exe
            App_Core/dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  apt:
    name: Publish the APT repository
    needs: linux
    runs-on: ubuntu-latest
    # Only for a real release. A dry run has nothing to publish, and
    # rebuilding the index from a build nobody can download would point
    # people's package managers at a file that is not there.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Fetch the package that was just built
        uses: actions/download-artifact@v4
        with:
          name: parallax-linux
          path: incoming

      - name: Install the packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends apt-utils

      - name: Import the signing key
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          PASS: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          echo "$KEY" | gpg --batch --import
          # A key imported from a file carries no trust, and signing an
          # untrusted key needs the ownertrust set or gpg refuses.
          echo "${{ secrets.APT_GPG_KEY_ID }}:6:" | gpg --import-ownertrust
          gpg --list-secret-keys --keyid-format=long

      - name: Build the repository
        env:
          KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          PASS: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # Only the current version is kept. Older ones are of no use to
          # apt, which installs whatever the index names, and every .deb
          # retained is another 85 MB living in git for ever.
          mkdir -p repo/pool/main/p/parallax-launcher
          mkdir -p repo/dists/stable/main/binary-amd64
          cp incoming/*.deb repo/pool/main/p/parallax-launcher/

          cd repo
          # Tells GitHub Pages to serve the tree as-is.
          touch .nojekyll
          # And which name it answers to. This repository's history is
          # replaced on every release, so the file has to be written
          # here — left to the repository it would be wiped by the
          # first publish and the domain would fall back to github.io
          # in the middle of somebody's apt update.
          echo 'apt.parallaxlauncher.com' > CNAME

          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          gzip -9kf dists/stable/main/binary-amd64/Packages

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Parallax Launcher" \
            -o APT::FTPArchive::Release::Label="Parallax Launcher" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Parallax Launcher releases" \
            release dists/stable > dists/stable/Release

          # Two signatures, because apt accepts either and older clients
          # look for the detached one.
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" \
              --local-user "$KEY_ID" --armor --detach-sign \
              -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" \
              --local-user "$KEY_ID" --clearsign \
              -o dists/stable/InRelease dists/stable/Release

          gpg --armor --export "$KEY_ID" > key.gpg

          printf '%s\n' \
            '# Parallax Launcher — APT repository' '' \
            'A package index, not source code. Rebuilt on every release and' \
            'holding only the current version.' '' \
            'Install instructions: https://parallaxlauncher.com' > README.md

          echo "--- built ---"
          find . -type f -not -path './.git/*' | sort

      - name: Publish it
        env:
          DEPLOY_KEY: ${{ secrets.APT_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          cd repo
          git init -q -b main
          git config user.name "Parallax release"
          git config user.email "ardayalin2011@gmail.com"
          git add -A
          git commit -q -m "Parallax Launcher ${GITHUB_REF_NAME}"
          # A fresh history every time. The index only ever describes the
          # current version, so keeping the old ones would grow the
          # repository by the size of a release for no one's benefit.
          git remote add origin git@github.com:ArdaYalinOzkan/parallax-apt.git
          git push -q --force origin main
          echo "published ${GITHUB_REF_NAME}"
