<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- No plate, and blue rather than white. A white mark on a
       transparent ground disappears on a light taskbar or a light
       browser tab; this colour holds on both, and it is the accent the
       application already uses. -->
